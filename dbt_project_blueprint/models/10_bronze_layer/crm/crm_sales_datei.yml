version: 2

models:
  - name: crm_sales_datei
    description: >
      Sales fact data extracted from the `sales_datei` source table,
      enriched with a technical load timestamp based on the dbt run execution time.
    columns:
      - name: sls_ord_num
        description: Sales order number.
        tests:
          - not_null
      - name: sls_prd_key
        description: Foreign key referencing the product.
      - name: sls_cust_id
        description: Foreign key referencing the customer.
      - name: sls_order_dt
        description: Date when the order was placed.
      - name: sls_ship_dt
        description: Date when the order was shipped.
      - name: sls_due_dt
        description: Due date for the order delivery.
      - name: sls_sales
        description: Total sales amount.
      - name: sls_quantity
        description: Quantity of items sold.
      - name: sls_price
        description: Unit price of the product.
      - name: load_timestamp
        description: Technical timestamp representing the dbt run execution time.
