version: 2

models:
  - name: sl_prd_cat
    description: >
      Product category data 
    columns:
      - name: cat_id
        description: Product category ID, contains null values and is not unique.
        tests:
          - not_null
          - unique
          - dbt_utils.relationships_where:
              to: ref('sl_prd_info')
              field: cat_id
              from_condition: cat_id != 'CO_PD'
      - name: cat
        description: category.
      - name: sub_cat
        description: sub-category.
      - name: maintenance
        description: maintenance.
      - name: load_timestamp
        description: Technical timestamp representing the dbt run execution time.
