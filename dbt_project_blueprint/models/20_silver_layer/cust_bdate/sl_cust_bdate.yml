version: 2

models:
  - name: sl_cust_bdate
    description: >
      customer birth date data 
    columns:
      - name: cst_key
        description: Customer ID.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('sl_cust_info')
              field: cst_key
      - name: cst_bdate
        description: Customer's birth date.
      - name: cst_gndr
        description: Customer's gender.
        tests:
          - accepted_values:
              values: ['Male', 'Female', 'Unknown']
      - name: load_timestamp
        description: Technical timestamp representing the dbt run execution time.
        tests:
          - not_null
