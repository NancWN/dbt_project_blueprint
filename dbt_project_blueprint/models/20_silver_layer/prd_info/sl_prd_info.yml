version: 2

models:
  - name: sl_prd_info
    description: >
      Product data from the `prd_info` source table,
      enriched with a technical load timestamp using `run_started_at`.
    columns:
      - name: prd_id
        description: Internal product ID.
        tests:
          - not_null
          - unique
      - name: prd_key
        description: Unique business key identifying the product.
        tests:
          - not_null
      - name: cat_id
        description:  identifying product category.
        tests:
          - not_null
      - name: prd_name
        description: Name of the product.
      - name: prd_desc
        description: Description of the product.
      - name: prd_cost
        description: Cost associated with the product.
      - name: prd_line
        description: Product line/category.
        tests:
          - accepted_values:
              values: ['Road', 'Touring', 'Other Sales', 'Mountain', 'Unknown']
      - name: prd_start_dt
        description: Product start date (valid from).
      - name: prd_end_dt
        description: Product end date (valid to).
      - name: is_current
        description: Indicates if the product is currently active.
        tests:
          - not_null
      - name: load_timestamp
        description: Technical timestamp representing the dbt run execution time.
